name: test

on:
  push:
  pull_request:

jobs:
  test:
    # Self-hosted runner: never run code from fork PRs on it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, homecontrol-ci]   # the runners in ci-runner/ (Hyper-V VMs on Aaron's desktop)
    timeout-minutes: 20
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # --network=host on every build: the build's pip runs on the runner VM's own network. Docker's bridged (NAT'd)
      # traffic gets no DNS on the homecontrol-ci VMs (the host NAT drops forwarded flows: ci-runner/main.tf).
      - name: Unit tests (pytest inside the image's test stage)
        run: docker build --network=host --target test -t homecontrol-ci:test-${{ github.run_id }} .

      - name: Build production image
        run: docker build --network=host -t homecontrol-ci:${{ github.run_id }} .

      - name: Clean up CI images
        if: always()
        run: docker image rm -f homecontrol-ci:test-${{ github.run_id }} homecontrol-ci:${{ github.run_id }} || true

  e2e:
    # Browser tests (Playwright, e2e/) + the Node unit tests (tests/*.test.js), against the real app and a fake HA.
    # They run in the Playwright image; test servers bind 127.0.0.1 on free ports. Never talks to the real HA.
    # Run locally (e2e/docker.sh) the container keeps its own network namespace, so nothing collides with a live app
    # on the same machine; on the CI VMs it uses the VM's network (E2E_DOCKER_ARGS below), where no live app runs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, homecontrol-ci]   # the runners in ci-runner/ (Hyper-V VMs on Aaron's desktop)
    timeout-minutes: 20
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    env:
      E2E_CONTAINER: homecontrol-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      # The Playwright container's apt-get and pip need the internet, and bridged traffic has none on the VMs (above).
      # On the VM's network the test servers still bind 127.0.0.1 on free ports, now the VM's loopback; the VM is
      # the job's alone, and the runner container (host network too) uses no ports.
      E2E_DOCKER_ARGS: --network=host
    steps:
      - uses: actions/checkout@v4

      - name: Output folder (screenshots, failure traces)
        run: echo "E2E_OUT=$RUNNER_TEMP/e2e-$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Browser tests (mcr.microsoft.com/playwright/python, pinned in e2e/docker.sh)
        run: e2e/docker.sh

      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.E2E_OUT }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: |
          docker rm -f "$E2E_CONTAINER" >/dev/null 2>&1 || true
          rm -rf "$E2E_OUT"

  publish:
    # Only main, only after the unit and browser tests pass: push the tested image to GitHub's container registry.
    # dockerbox runs no runner; Watchtower there pulls :latest and restarts the app (see dockge/compose.yaml).
    # Set the repository variable AUTO_DEPLOY=false to switch this off.
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY != 'false'
    runs-on: [self-hosted, homecontrol-ci]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the tested commit
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Push to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Tidy up
        if: always()
        run: |
          docker logout ghcr.io || true
          docker image rm -f "$IMAGE:${{ github.sha }}" "$IMAGE:latest" || true
