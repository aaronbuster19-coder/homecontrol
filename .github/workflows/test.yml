name: test

on:
  push:
  pull_request:

jobs:
  test:
    # Self-hosted runner: never run code from fork PRs on it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 20
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (pytest inside the image's test stage)
        run: docker build --target test -t homecontrol-ci:test-${{ github.run_id }} .

      - name: Build production image
        run: docker build -t homecontrol-ci:${{ github.run_id }} .

      - name: Clean up CI images
        if: always()
        run: docker image rm -f homecontrol-ci:test-${{ github.run_id }} homecontrol-ci:${{ github.run_id }} || true

  deploy:
    # Only main, only after tests pass, and only on the runner that lives on dockerbox.
    # Set the repository variable AUTO_DEPLOY=false to switch this off.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY != 'false'
    runs-on: self-hosted
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false  # never interrupt a deploy half-way
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/stacks/homecontrol' }}
      IMAGE: homecontrol:latest
      CONTAINER: homecontrol
    steps:
      - uses: actions/checkout@v4

      - name: Build the tested commit
        run: docker build -t homecontrol:deploy-${{ github.sha }} .

      - name: Swap in the new image (keep the old one for rollback)
        run: |
          test -f "$DEPLOY_DIR/compose.yaml" || test -f "$DEPLOY_DIR/docker-compose.yml" \
            || { echo "No compose file in $DEPLOY_DIR"; exit 1; }
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then docker tag "$IMAGE" homecontrol:previous; fi
          docker tag homecontrol:deploy-${{ github.sha }} "$IMAGE"
          cd "$DEPLOY_DIR" && docker compose up -d --no-build --force-recreate

      - name: Wait for the container to be healthy (roll back if not)
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo missing)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 5
          done
          echo "New container never became healthy; rolling back"
          docker logs --tail 50 "$CONTAINER" || true
          if docker image inspect homecontrol:previous >/dev/null 2>&1; then
            docker tag homecontrol:previous "$IMAGE"
            cd "$DEPLOY_DIR" && docker compose up -d --no-build --force-recreate
          fi
          exit 1

      - name: Tidy old deploy images
        if: always()
        run: docker image rm -f homecontrol:deploy-${{ github.sha }} || true
